{% extends 'base.html' %}

{% block content %}

<div class="container py-5">
    <h2 class="text-center mb-5">Наши работы</h2>

    <div class="row">
        {% for item in items %}
        <div class="col-12 col-md-6 mb-4">
            <div class="card custom-card">
                <h5>{{ item.title }}</h5>
                <div class="row">
    <div class="col-6 text-center">
        <p class="text-secondary">До</p>
        <img src="{{ item.before_img }}" class="img-fluid rounded">
    </div>

    <div class="col-6 text-center">
        <p class="text-secondary">После</p>
        <img src="{{ item.after_img }}" class="img-fluid rounded">
    </div>
</div>
            </div>
        </div>
        {% endfor %}
    </div>
</div>

{% endblock %}
